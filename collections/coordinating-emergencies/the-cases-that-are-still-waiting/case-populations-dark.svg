<svg color="rgb(85.1% 90.98% 86.27%)" width="400" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-labelledby="case-populations-title"><title id="case-populations-title">Validated crime cases are inside the completed forwarded-crime group and all completed outcomes; pending and other unresolved events remain within all recorded work.</title><rect width="400" height="460" fill="rgb(5.88% 9.41% 7.45%)"/><rect x="12" y="12" width="376" height="430" fill="none" stroke="rgb(85.1% 90.98% 86.27%)" stroke-width="1.5" data-population="R"></rect><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="28" y="43">R · All recorded events</text><rect x="30" y="68" width="340" height="249" fill="none" stroke="rgb(85.1% 90.98% 86.27%)" stroke-width="1.5" data-population="N"></rect><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="46" y="98">N · Completed outcomes</text><rect x="50" y="122" width="300" height="175" fill="none" stroke="rgb(85.1% 90.98% 86.27%)" stroke-width="1.5" data-population="C"></rect><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="66" y="152">C · Forwarded as crime</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="66" y="177">final judgment complete</text><rect x="72" y="200" width="255" height="73" fill="none" stroke="rgb(85.1% 90.98% 86.27%)" stroke-width="1.5" data-population="V"></rect><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="88" y="230">V · Validated as crime</text><rect x="30" y="335" width="190" height="84" fill="none" stroke="rgb(85.1% 90.98% 86.27%)" stroke-width="1.5" data-population="P"></rect><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="45" y="366">P · Awaiting</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="45" y="392">final validation</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="238" y="356">Other</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="238" y="382">unresolved</text><text font-family="var(--type-family-reading, 'Instrument Sans', sans-serif)" font-size="20" fill="rgb(85.1% 90.98% 86.27%)" x="238" y="408">events</text></svg>
