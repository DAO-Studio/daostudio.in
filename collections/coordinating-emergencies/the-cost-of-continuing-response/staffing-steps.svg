<svg xmlns="http://www.w3.org/2000/svg" width="420" height="612" viewBox="0 0 420 612" role="img" aria-labelledby="staffing-steps-title staffing-steps-desc">
<title id="staffing-steps-title">Staffing grows in whole steps</title><desc id="staffing-steps-desc">Budget one operator per 100 paying Tier 2 customers, rounded up, then one manager per ten operators, rounded up. The solid line counts operators and the dashed line counts managers. At 1000 customers the budget is ten operators and one manager; at 1001 it is eleven and two. A whole step at the next customer.</desc>
<text x="20" y="30" fill="var(--color-ink, #213529)" font-family="var(--type-family-reading, sans-serif)" font-size="20">One operator per 100 customers</text>
<text x="20" y="60" fill="var(--color-ink, #213529)" font-family="var(--type-family-reading, sans-serif)" font-size="20">One manager per 10 operators</text>
<text x="20" y="90" fill="var(--color-ink, #213529)" font-family="var(--type-family-reading, sans-serif)" font-size="20">Round up at each step.</text>
