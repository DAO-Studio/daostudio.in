uestion","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eThe \u003ca href=\"https://daostudio.in/collections/\" data-gazette-link=\"content:dao-studio-home#link-10\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"content:dao-studio-collections\" data-gazette-destination-site=\"site:dao-studio\" data-gazette-destination-theme=\"theme:chassis\"\u003einquiries\u003c/a\u003e develop incident coordination, application composition and reuse. \u003ca href=\"https://daostudio.in/about/\" data-gazette-link=\"content:dao-studio-home#link-11\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"content:dao-studio-about\" data-gazette-destination-site=\"site:dao-studio\" data-gazette-destination-theme=\"theme:chassis\"\u003eAbout DAO Studio\u003c/a\u003e connects those questions to the studio’s purpose, people and consulting route.\u003c/p\u003e\n"},"name":"Where can I read more about the work?"}]}],"identifier":"content:dao-studio-home","image":[{"@type":"ImageObject","contentUrl":"https://daostudio.in/assets/renditions/owl/poses/front.webp","description":"A mechanical owl with camera-like eyes and intricately connected parts."}],"inLanguage":"en","mentions":[{"@id":"https://daostudio.in/daonet/#entity","@type":"CreativeWork","identifier":"project:daonet","name":"DAOnet","subjectOf":[{"@id":"https://daostudio.in/daonet/","@type":"CollectionPage","identifier":"content:dao-studio-daonet","name":"DAOnet","url":"https://daostudio.in/daonet/"},{"@id":"https://daostudio.in/daonet/reuse-a-capability/#article","@type":"Article","identifier":"content:dao-studio-daonet-docs","name":"Reuse a capability","url":"https://daostudio.in/daonet/reuse-a-capability/"},{"@id":"https://daostudio.in/daonet/mentions/","@type":"CollectionPage","identifier":"content:daonet-mentions","name":"DAOnet mentions","url":"https://daostudio.in/daonet/mentions/"}]},{"@id":"https://daostudio.in/yojn-care/#entity","@type":"SoftwareApplication","identifier":"project:yojn-care","name":"YOJN Care","subjectOf":[{"@id":"https://daostudio.in/yojn-care/","@type":"CollectionPage","identifier":"content:dao-studio-yojn-care","name":"YOJN Care","url":"https://daostudio.in/yojn-care/"},{"@id":"https://daostudio.in/yojn-care/follow-an-incident/#article","@type":"Article","identifier":"content:dao-studio-yojn-care-docs","name":"Follow an incident","url":"https://daostudio.in/yojn-care/follow-an-incident/"},{"@id":"https://daostudio.in/yojn-care/mentions/","@type":"CollectionPage","identifier":"content:yojn-care-mentions","name":"YOJN Care mentions","url":"https://daostudio.in/yojn-care/mentions/"}]},{"@id":"https://daostudio.in/yojnai/#entity","@type":"SoftwareApplication","identifier":"project:yojnai","name":"YojnAI","subjectOf":[{"@id":"https://daostudio.in/yojnai/","@type":"CollectionPage","identifier":"content:dao-studio-yojnai","name":"YojnAI","url":"https://daostudio.in/yojnai/"},{"@id":"https://daostudio.in/yojnai/compose-inspect-and-improve/#article","@type":"TechArticle","identifier":"content:dao-studio-yojnai-docs","name":"Compose, inspect and improve an application","url":"https://daostudio.in/yojnai/compose-inspect-and-improve/"},{"@id":"https://daostudio.in/yojnai/mentions/","@type":"CollectionPage","identifier":"content:yojnai-mentions","name":"YojnAI mentions","url":"https://daostudio.in/yojnai/mentions/"}]}],"name":"DAO Studio","publisher":{"@id":"https://daostudio.in/#organization","@type":"Organization","identifier":"organization:dspl","name":"DAO Studio Private Limited","sameAs":[{"@id":"https://github.com/DAO-Studio"}],"url":"https://daostudio.in/"},"text":"A mechanical owl with camera-like eyes and intricately connected parts.\nFront Left Right Up Down\nSee what matters. Act with clarity.\nConnect the right information with the people who need to act, from responding to an incident to putting AI to work across your organisation.\nYOJN Care\nBring the person asking for help, the evidence and the response team together.\nYojnAI\nConnect models, tools and your organisation’s knowledge in AI applications your team can guide.\nDAOnet\nA protocol design for finding and reusing AI capabilities with their context and conditions understood; no marketplace runs.\nQuestions about the products\nHow can we discuss a product or purchase?\nThe products are paused. DAO Studio’s products remain available through RawThoughts consulting. Bring your requirements to discuss purchase, delivery scope and licensing with RTEPL.\nHow do the three products differ?\nYOJN Care connects the people and evidence needed for a continuing response. YojnAI gives teams a composition they can inspect and improve. DAOnet carries reusable capability across applications. Each solves a different coordination problem; they need not be adopted as one platform.\nWhere can I read more about the work?\nThe inquiries develop incident coordination, application composition and reuse. About DAO Studio connects those questions to the studio’s purpose, people and consulting route.\nFrom a conversation to useful work\nAn answer is one part of an AI application. The records it uses, the work it carries out and the way a team can inspect and improve it determine whether it becomes useful in everyday operation.\nExplore application composition\nCapability beyond one application\nReusing another team’s AI work means understanding its context, dependencies and conditions of use. Follow the protocols and continuing relationships that let useful capability travel between applications.\nExplore protocols and reuse\nPeople around a response\nA detection becomes useful when the evidence, the reviewer and the next responder stay connected. Follow how a response is carried from request to action.\nExplore coordinating emergencies\n","url":"https://daostudio.in/","usageInfo":{"@id":"https://daostudio.in/terms/"}}</script>
